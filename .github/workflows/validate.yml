name: Validate Chimera website
on:
  push:
    branches: [main, feature/final-storefront-hardening]
  pull_request:
    branches: [main, feature/final-storefront-hardening]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit pages and assets
        run: npm run audit
      - name: Typecheck
        run: npm run typecheck
      - name: Production export
        run: npm run build
      - name: Verify generated routes and metadata
        run: |
          test -f out/index.html
          test -f out/care/index.html
          test -f out/help/index.html
          test -f out/privacy/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/icon.svg
